{% extends 'base.html' %}{% block content %}<div class="auth card"><h1>Schedule Collection Visit</h1><p class="muted"><strong>{{item.name}}</strong> · Item #{{item.id}}</p><form class="form" method="post"><label>Visiting date<input type="date" name="date" min="{{min_date}}" required></label><label>Available time slot<select name="slot" required><option value="">Choose a slot</option>{% for slot in slots %}<option>{{slot}}</option>{% endfor %}</select></label><button class="btn full">Confirm Visit</button></form></div>{% endblock %}
