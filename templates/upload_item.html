{% extends 'base.html' %}{% block content %}<div class="container"><div class="auth card" style="margin:30px auto"><h1>Upload Found Item</h1><form class="form" method="post" enctype="multipart/form-data"><label>Item photograph<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"></label><label>Item name<input name="name" required placeholder="Black Water Bottle"></label><label>Category<input name="category" required placeholder="Water Bottle"></label><label>Description<textarea name="description" placeholder="Black bottle with a small sticker"></textarea></label><label>Location found<input name="location" required placeholder="College Library"></label><label>Date found<input type="date" name="date_found" required></label><p class="muted">Upload date & time are recorded automatically by the system.</p><button class="btn full">Upload Item</button></form></div></div>{% endblock %}
